<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NODE//ZERO build</title>
<style>
  body { background: #05090a; color: #b8f5d8; font-family: Consolas, "MS Gothic", monospace; padding: 24px; line-height: 1.7; }
  button { font: inherit; background: transparent; color: #3dffa8; border: 1px solid #3dffa8; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #3dffa8; color: #05090a; }
  #out { white-space: pre-wrap; color: #5d8f7c; }
  .ok { color: #3dffa8; } .ng { color: #ff4d6a; }
</style>
</head>
<body>
<h1>NODE//ZERO build</h1>
<p>src/scenario.js → docs/scenario.data.js（鍵付きノードを暗号化）</p>
<p>※ tools/serve.ps1 で起動したサーバー経由で開いてください</p>
<button id="build">ビルド</button>
<div id="out"></div>

<script src="../src/scenario.js"></script>
<script src="../docs/nz-crypto.js"></script>
<script>
const out = document.getElementById("out");
const log = (msg, cls = "") => { const d = document.createElement("div"); d.textContent = msg; d.className = cls; out.appendChild(d); };

async function build() {
  out.textContent = "";
  const data = JSON.parse(JSON.stringify(SCENARIO));
  for (const [id, node] of Object.entries(data.nodes)) {
    if (!node.lock) continue;
    const { pass, hint } = node.lock;
    const box = await NZ.lock(node.body, pass);
    // 復号テスト
    if (await NZ.unlock(box, pass) !== node.body) throw new Error(`${id}: 復号テストに失敗`);
    node.lock = { hint, ...box };
    delete node.body;
    log(`🔒 ${id}: 暗号化しました`);
  }
  // リンク切れチェック
  // （名前の決め方は docs/index.html の linkName と同じ）
  for (const [id, node] of Object.entries(SCENARIO.nodes)) {
    const box = document.createElement("div");
    box.innerHTML = node.body;
    const names = new Set();
    box.querySelectorAll("a[data-go]").forEach(a => {
      if (!SCENARIO.nodes[a.dataset.go]) log(`⚠ ${id} → ${a.dataset.go}: 転移先がありません`, "ng");
      const name = a.dataset.name || a.textContent.trim().split(/[\s　]/)[0].replace(/\.(nexus\.local|anon-net)\b.*$/, "");
      if (names.has(name)) log(`⚠ ${id}: 接続先の名前「${name}」が重複しています（data-name で変えてください）`, "ng");
      names.add(name);
    });
  }
  // 最後のコマンドと結末の条件チェック
  for (const ev of SCENARIO.finale.evidence) {
    if (!SCENARIO.nodes[ev.node]) log(`⚠ finale.evidence「${ev.label}」: ノード ${ev.node} がありません`, "ng");
  }
  for (const s of SCENARIO.suspects) {
    if (!s.id || /\s/.test(s.id)) log(`⚠ 結末「${s.name}」: id（コマンドで打つ名前、空白なし）が必要です`, "ng");
    for (const e of s.endings) {
      for (const id of e.requires || []) {
        if (!SCENARIO.nodes[id]) log(`⚠ 結末「${s.name}」の条件 ${id}: ノードがありません`, "ng");
      }
    }
    if ((s.endings.at(-1).requires || []).length) log(`⚠ 結末「${s.name}」: 最後の結末には requires を付けないでください（どれにも当てはまらない場合の受け皿）`, "ng");
  }
  const js =`// 自動生成ファイル（tools/build.html）。直接編集しないでください。\nwindow.SCENARIO_DATA = ${JSON.stringify(data, null, 2)};\n`;
  const res = await fetch("/__build", { method: "PUT", body: js });
  if (!res.ok) throw new Error(`書き込み失敗 (${res.status})`);
  log(`✔ docs/scenario.data.js を書き出しました（${js.length} 文字）`, "ok");
}

document.getElementById("build").onclick = () => build().catch(e => log("✖ " + e.message, "ng"));
</script>
</body>
</html>
