<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NODE//ZERO</title>
<style>
  :root {
    --bg: #05090a; --panel: #0b1214; --line: #1c3a34;
    --fg: #b8f5d8; --dim: #5d8f7c; --accent: #3dffa8; --alert: #ff4d6a; --warn: #ffc14d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "BIZ UDGothic", "Consolas", "MS Gothic", monospace;
    font-size: 15px; line-height: 1.7;
  }
  .wrap {
    max-width: 1100px; height: 100%; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: 1fr 260px; grid-template-rows: auto 1fr; gap: 16px;
  }
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: 100dvh; padding: 12px; gap: 10px; }
    header { order: -2; }
    aside { order: -1; padding: 10px 12px; }
    .bar { margin-bottom: 6px; }
    #log { max-height: 3.4em; }
    #term { padding: 12px; }
  }
  header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: .2em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-height: 0; }
  h2 { font-size: 13px; color: var(--dim); margin: 0 0 6px; letter-spacing: .1em; font-weight: normal; }

  /* ターミナル */
  #term { overflow-y: auto; cursor: text; }
  .line { white-space: pre-wrap; word-break: break-word; }
  .line.node { white-space: normal; }
  .echo { color: var(--fg); }
  .echo .ps, .ps { color: var(--accent); }
  .dim { color: var(--dim); }
  .sys { color: var(--accent); }
  .alert { color: var(--alert); }
  .warn { color: var(--warn); }
  .meta { color: var(--dim); font-size: 13px; margin: 0; }
  .node-head { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .node-head b { font-size: 17px; font-weight: normal; }
  .doc { border-left: 2px solid var(--line); padding: 2px 12px; margin: 10px 0; white-space: normal; }
  .doc p { margin: 4px 0; }
  .node p { margin: 6px 0; white-space: normal; }
  .log { background: #000; border: 1px solid var(--line); padding: 10px; overflow-x: auto; font-size: 13px; margin: 8px 0; white-space: pre; }
  .tlink { color: var(--accent); border-bottom: 1px dashed var(--accent); }
  .tag { color: var(--accent); }
  .ls { display: grid; grid-template-columns: max-content 1fr; column-gap: 20px; margin: 8px 0 4px; }
  .ls .n { color: var(--accent); }
  .ls .ow { color: var(--warn); }
  .ls { row-gap: 2px; }
  /* タップ／クリックで入力欄にコマンドが入る */
  .pick { cursor: pointer; border-radius: 3px; padding: 1px 5px; margin: -1px -5px; }
  .pick:hover, .pick:active { background: var(--accent); color: var(--bg); }
  .ow.pick:hover, .ow.pick:active { background: var(--warn); }
  #run {
    font: inherit; font-size: 14px; background: transparent; color: var(--accent); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 12px; cursor: pointer;
  }
  #run:hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: baseline; }
  #cmd {
    flex: 1; min-width: 0; font: inherit; background: transparent; color: var(--fg); border: none; outline: none; padding: 0;
    caret-color: var(--accent);
  }
  .ending { margin-top: 12px; }

  /* トレースメーター */
  .trace-label { display: flex; justify-content: space-between; font-size: 13px; }
  .bar { height: 10px; background: #000; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin: 4px 0 16px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s, background .6s; }
  /* アクセスログ */
  #log { list-style: none; padding: 0; margin: 0; font-size: 12px; max-height: 60vh; overflow-y: auto; }
  #log li { color: var(--dim); border-bottom: 1px dotted var(--line); padding: 2px 0; }
  #log li.bad { color: var(--alert); }
  #log li.ow { color: var(--warn); }

  .flash { animation: flash .5s 2; }
  @keyframes flash { 50% { background: #3a0a12; } }

  /* フィナーレ演出 */
  .glitch { animation: glitch .14s steps(2) infinite; }
  @keyframes glitch {
    0%   { transform: translate(0, 0); filter: none; }
    25%  { transform: translate(-4px, 2px); filter: hue-rotate(90deg) saturate(3); }
    50%  { transform: translate(3px, -2px); filter: invert(1); }
    75%  { transform: translate(-2px, -1px); filter: hue-rotate(-60deg); }
    100% { transform: translate(2px, 1px); filter: none; }
  }
  .bar.racing i { transition: width .1s linear, background .3s; }

  #overlay {
    position: fixed; inset: 0; z-index: 20; background: #000; display: none;
    overflow-y: auto; cursor: pointer; opacity: 0; transition: opacity 1s;
  }
  #overlay.on { display: flex; }
  #overlay.visible { opacity: 1; }
  #overlay .inner { margin: auto; max-width: 640px; padding: 48px 24px 80px; }
  #overlay .text { white-space: pre-wrap; line-height: 2.1; font-size: 16px; min-height: 1em; }
  #overlay .text::after { content: "▌"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  #overlay.typed .text::after { content: ""; }
  @keyframes blink { 50% { opacity: 0; } }
  #overlay .endtag {
    margin-top: 40px; text-align: center; font-size: 30px; letter-spacing: .35em; color: var(--accent);
    opacity: 0; transform: scale(1.3); transition: opacity 2s, transform 2s; text-shadow: 0 0 18px currentColor;
  }
  #overlay .endtag.show { opacity: 1; transform: none; }
  #overlay .endtag.bad { color: var(--alert); }
  #overlay .hint { margin-top: 48px; text-align: center; color: var(--dim); font-size: 13px; opacity: 0; transition: opacity 1s; }
  #overlay .hint.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1 id="gameTitle">NODE//ZERO</h1>
    <span id="clock" class="meta"></span>
  </header>

  <main class="panel" id="term">
    <div id="out"></div>
    <form class="row" id="form" autocomplete="off">
      <span class="ps" id="prompt"></span>
      <input id="cmd" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" enterkeyhint="go" aria-label="コマンド入力">
      <button id="run" type="submit" aria-label="実行">⏎</button>
    </form>
  </main>

  <aside class="panel">
    <div class="trace-label"><span>TRACE（逆探知）</span><span id="traceNum">0%</span></div>
    <div class="bar"><i id="traceBar"></i></div>
    <h2>ACCESS LOG</h2>
    <ul id="log"></ul>
  </aside>
</div>

<div id="overlay"></div>

<script src="nz-crypto.js"></script>
<script src="scenario.data.js"></script>
<script>
// =========================================================
//  エンジン（シナリオは src/scenario.js 側で編集 → tools/build.html でビルド）
//  ?dev を付けて開くと、ビルドせずに src/scenario.js を直接読み込む
//
//  操作はターミナルのコマンド。普段は ssh <名前> と back だけ。
//  シナリオ本文の <a data-go> は「接続先」として一覧表示され、ssh <名前> で転移する。
//  名前は data-name があればそれ、なければリンク文字列の先頭語（xxx.nexus.local → xxx）。
//  報告画面で finale.command（expose <犯人>）を打つとフィナーレ演出 → 結末。
// =========================================================
(async () => {
const $ = id => document.getElementById(id);
const out = $("out"), cmd = $("cmd");
let S, state;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function loadScript(src) {
  return new Promise((ok, ng) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => ng(new Error(src + " を読み込めません"));
    document.head.appendChild(s);
  });
}

async function loadScenario() {
  if (new URLSearchParams(location.search).has("dev")) {
    await loadScript("../src/scenario.js");
    return SCENARIO;
  }
  if (!window.SCENARIO_DATA) throw new Error("scenario.data.js がありません（tools/build.html でビルドしてください）");
  return window.SCENARIO_DATA;
}

// 鍵付きノードの本文：開発モードは平文比較、公開データは復号
async function tryUnlock(node, input) {
  if ("pass" in node.lock) return input === node.lock.pass ? node.body : null;
  return NZ.unlock(node.lock, input);
}

// ---------------- 表示 ----------------
function print(html, cls = "") {
  const d = document.createElement("div");
  d.className = "line " + cls;
  d.innerHTML = html;
  out.appendChild(d);
  scrollDown();
  return d;
}
const scrollDown = () => { $("term").scrollTop = $("term").scrollHeight; };

function shortHost(host) { return host.split(/[./]/)[0]; }
function setPrompt(text) { $("prompt").textContent = text; }
function normalPrompt() {
  const node = state.current && S.nodes[state.current];
  setPrompt(`guest@${node ? shortHost(node.host) : "localhost"}:~$`);
  cmd.type = "text";
}

function clockText() {
  const t = 2 * 60 + 3 + state.minutes; // 深夜 02:03 から開始
  return `${String(Math.floor(t / 60) % 24).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
}
function addLog(text, cls = "") {
  const li = document.createElement("li");
  li.textContent = `${clockText()}  ${text}`;
  if (cls) li.className = cls;
  $("log").prepend(li);
}
function updateTrace(shown = state.trace) {
  const t = Math.min(100, shown);
  $("traceNum").textContent = t + "%";
  $("traceBar").style.width = t + "%";
  $("traceBar").style.background = t >= 70 ? "var(--alert)" : t >= 40 ? "var(--warn)" : "var(--accent)";
}
function addTrace(n) {
  state.trace += n;
  updateTrace();
  $("term").classList.remove("flash"); void $("term").offsetWidth; $("term").classList.add("flash");
  if (state.trace >= 100) {
    state.over = true;
    state.busy = true;
    cmd.disabled = true;
    (async () => {
      await sleep(600);
      print("*** CONNECTION LOST ***", "alert");
      $("wrap").classList.add("glitch");
      await sleep(900);
      showEnding(S.gameOver);
    })();
  }
}

// ---------------- ノード ----------------
function linkName(a) {
  if (a.dataset.name) return a.dataset.name;
  return a.textContent.trim().split(/[\s　]/)[0].replace(/\.(nexus\.local|anon-net)\b.*$/, "");
}

// 本文 HTML をターミナル用に変換し、接続先の一覧を取り出す
function parseNode(html) {
  const box = document.createElement("div");
  box.innerHTML = html;
  const links = [];
  box.querySelectorAll("a[data-go]").forEach(a => {
    const text = a.textContent.trim();
    const desc = text.includes("──") ? text.split("──")[1].trim() : text;
    links.push({ name: linkName(a), go: a.dataset.go, oneway: a.hasAttribute("data-oneway"), desc });
  });
  box.querySelectorAll("ul.links").forEach(ul => ul.remove());
  box.querySelectorAll("a[data-go]").forEach(a => {
    const span = document.createElement("span");
    const name = esc(linkName(a));
    span.innerHTML = `<span class="tlink">${esc(a.textContent)}</span> <span class="tag pick" data-fill="ssh ${name}">[${name}]</span>`;
    a.replaceWith(span);
  });
  return { html: box.innerHTML, links };
}

function printLinks() {
  if (!state.links.length) { print("接続先はありません。", "dim"); return; }
  const rows = state.links.map(l =>
    `<span class="n pick${l.oneway ? " ow" : ""}" data-fill="ssh ${esc(l.name)}">${esc(l.name)}</span><span${l.oneway ? ' class="ow"' : ""}>${esc(l.desc)}${l.oneway ? "　【一方通行】" : ""}</span>`
  ).join("");
  print(`<div class="ls">${rows}</div><span class="dim">ssh &lt;名前&gt; で接続（名前をタップでも入力できます）</span>`);
}

function enterNode(id, opt = {}) {
  const node = S.nodes[id];
  if (state.current && !opt.isBack) state.history.push(state.current);
  if (opt.oneway) state.history = [];
  state.current = id;
  $("clock").textContent = `9/22 ${clockText()}`;

  if (opt.oneway) addLog(`ONE-WAY → ${node.host}`, "ow");
  else if (!state.visited.has(id) || node.trap) addLog(`→ ${node.host}`, node.trap ? "bad" : "");
  state.visited.add(id);

  showNode();
  if (node.trap) addTrace(node.trap);
}

// 画面をさかのぼった古い一覧は押せないようにする
function disablePicks() {
  out.querySelectorAll(".pick").forEach(el => el.classList.remove("pick"));
}

function showNode() {
  disablePicks();
  const node = S.nodes[state.current];
  const { html, links } = parseNode(node.lock ? state.unlocked.get(state.current) : node.body);
  state.links = links;
  print(`<span class="dim">ssh://${esc(node.host)}</span>\n<b>${esc(node.title)}</b>`, "node-head");
  print(html, "node");
  if (node.ending) {
    const rows = S.suspects.map(s =>
      `<span class="n pick" data-fill="${esc(S.finale.command)} ${esc(s.id)}">${esc(s.id)}</span><span>${esc(s.name)}</span>`).join("");
    print(`<div class="ls">${rows}</div>最後のコマンド：<span class="sys">${esc(S.finale.command)} &lt;名前&gt;</span>`, "warn");
  } else {
    printLinks();
  }
  normalPrompt();
}

// 転移（演出つき）。鍵付きなら先にパスワードを聞く
async function connect(id, opt = {}) {
  const node = S.nodes[id];
  state.busy = true;
  cmd.disabled = true;
  const line = print(`Connecting to ${esc(node.host)} `, "dim");
  for (let i = 0; i < 8; i++) { await sleep(55); line.innerHTML += "▓"; scrollDown(); }
  state.minutes += 2 + Math.floor(Math.random() * 4);
  state.busy = false;
  cmd.disabled = false;
  cmd.focus();

  if (node.lock && !state.unlocked.has(id)) {
    print(`<span class="warn">認証が必要です。</span>\n${esc(node.lock.hint)}\n<span class="dim">※ 間違えるとトレースが上昇します</span>`);
    state.mode = { type: "password", id, opt };
    setPrompt("password:");
    cmd.type = "password";
    return;
  }
  enterNode(id, opt);
}

// ---------------- フィナーレ ----------------
const randHex = n => Array.from({ length: n }, () => Math.floor(Math.random() * 256).toString(16).padStart(2, "0")).join(" ");

async function finale(suspect) {
  state.busy = true;
  cmd.disabled = true;
  const wrap = $("wrap");
  $("form").style.visibility = "hidden";

  print(`[*] ターゲット：${esc(suspect.name)}`, "warn");
  await sleep(700);
  print("[*] 証拠パッケージを作成中...", "sys");
  for (const ev of S.finale.evidence) {
    await sleep(420);
    print(state.visited.has(ev.node)
      ? `    + ${esc(ev.label)}  <span class="sys">OK</span>`
      : `    - ${esc(ev.label)}  <span class="alert">MISSING</span>`, "dim");
  }
  await sleep(800);
  print("[*] 送信先：relay.anon-net → 依頼人", "sys");
  await sleep(500);

  // 送信バーと同時に逆探知が跳ね上がる
  const bar = print("", "sys");
  const from = state.trace;
  $("traceBar").parentElement.classList.add("racing");
  for (let i = 0; i <= 32; i++) {
    bar.textContent = `    [${"#".repeat(i)}${".".repeat(32 - i)}] ${Math.round(i / 32 * 100)}%`;
    updateTrace(Math.round(from + (99 - from) * (i / 32) ** 1.6));
    if (i === 10) print("[!] 逆探知を検知", "alert");
    if (i === 20) { print("[!] 逆探知が加速しています", "alert"); wrap.classList.add("glitch"); }
    if (i === 28) print("[!!] 接続元まであと 1 ホップ", "alert");
    scrollDown();
    await sleep(i < 20 ? 90 : 150);
  }
  // データが流れる
  for (let i = 0; i < 26; i++) {
    print(`0x${(0x7f3a00 + i * 16).toString(16)}  ${randHex(16)}`, "dim");
    await sleep(22);
  }
  print("[*] TRANSMISSION COMPLETE", "sys");
  await sleep(350);
  print("[*] 回線を切断。痕跡を消去しました。", "sys");
  await sleep(700);
  wrap.classList.remove("glitch");
  $("traceBar").parentElement.classList.remove("racing");

  // requires のノードをすべて訪れている最初の結末
  const ending = suspect.endings.find(e => (e.requires || []).every(id => state.visited.has(id)));
  showEnding(ending.text);
}

// 暗転 → 結末を1文字ずつ表示 → エンドタグ
async function showEnding(text) {
  state.over = true;
  state.busy = true;
  state.mode = null;
  cmd.disabled = true;

  const lines = text.trim().split("\n");
  const tag = lines.at(-1).startsWith("──") ? lines.pop().replace(/^──\s*/, "") : "";
  const body = lines.join("\n").trim();

  const ov = $("overlay");
  ov.className = "on";
  ov.innerHTML = `<div class="inner"><div class="text"></div><div class="endtag"></div><div class="hint">クリック / Enter で最初から</div></div>`;
  await sleep(50);
  ov.classList.add("visible");
  await sleep(1600);
  $("wrap").classList.remove("glitch");

  const el = ov.querySelector(".text");
  state.skip = false;
  for (const ch of body) {
    if (state.skip) break;
    el.textContent += ch;
    await sleep(ch === "\n" ? 260 : "。』」".includes(ch) ? 220 : "、…".includes(ch) ? 110 : 38);
  }
  el.textContent = body;
  ov.classList.add("typed");
  await sleep(900);
  const t = ov.querySelector(".endtag");
  t.textContent = tag;
  if (/BAD|GAME OVER/.test(tag)) t.classList.add("bad");
  t.classList.add("show");
  await sleep(1800);
  ov.querySelector(".hint").classList.add("show");
  state.endReady = true;
}

function overlayInput() {
  if (state.endReady) { $("overlay").className = ""; reset(); }
  else state.skip = true;
}
$("overlay").addEventListener("click", overlayInput);
document.addEventListener("keydown", e => {
  if ($("overlay").classList.contains("on") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); overlayInput(); }
});

// ---------------- コマンド ----------------
const HELP = [
  ["ssh <名前>", "接続先へ転移する（例：ssh mail）"],
  ["back", "ひとつ前の場所へ戻る"],
  ["help", "この一覧"],
];

const COMMANDS = {
  help() {
    const rows = HELP.map(([c, d]) => `<span class="n">${esc(c)}</span><span>${esc(d)}</span>`).join("");
    print(`<div class="ls">${rows}</div><span class="dim">Tab で補完 ／ ↑↓ で履歴</span>`);
  },
  ssh(arg) {
    if (!arg) return print("使い方：ssh &lt;名前&gt;", "dim");
    const link = state.links.find(l => l.name.toLowerCase() === arg.toLowerCase());
    if (!link) return print(`ssh: 接続先が見つかりません: ${esc(arg)}`, "alert");
    if (link.oneway) {
      disablePicks();
      print(`⚠ 一方通行です。この先は戻れません。　<span class="n pick ow" data-fill="y">y 進む</span>　<span class="n pick" data-fill="n">n やめる</span>`, "warn");
      state.mode = { type: "confirm", id: link.go };
      setPrompt("続けますか？ [y/N]");
      return;
    }
    return connect(link.go);
  },
  back() {
    if (!state.history.length) return print("back: これ以上戻れません。", "dim");
    return connect(state.history.pop(), { isBack: true });
  },
  // 隠しコマンド（help には出さない）
  ls: () => (S.nodes[state.current].ending ? showNode() : printLinks()),
  reboot: () => reset(),
};
COMMANDS.cd = COMMANDS.ssh;
COMMANDS.exit = COMMANDS.back;

// 最後のコマンド（報告画面でのみ有効）
function finaleCommand(arg) {
  if (!S.nodes[state.current].ending) return print(`${esc(S.finale.command)}: まだその時じゃない。`, "dim");
  const s = S.suspects.find(x => x.id.toLowerCase() === (arg || "").toLowerCase());
  if (!s) return print(`使い方：${esc(S.finale.command)} &lt;名前&gt;（${S.suspects.map(x => esc(x.id)).join(" / ")}）`, "dim");
  return finale(s);
}

async function run(raw) {
  const mode = state.mode;
  if (mode?.type === "password") {
    state.mode = null;
    print(`<span class="ps">password:</span> ${"*".repeat(raw.length)}`, "echo");
    const node = S.nodes[mode.id];
    cmd.disabled = true;
    const body = await tryUnlock(node, raw.trim());
    cmd.disabled = false;
    cmd.focus();
    if (body !== null) {
      state.unlocked.set(mode.id, body);
      print("Access granted.", "sys");
      addLog(`AUTH OK  ${node.host}`);
      enterNode(mode.id, mode.opt);
    } else {
      print("Permission denied.", "alert");
      addLog(`AUTH FAIL  ${node.host}`, "bad");
      normalPrompt();
      addTrace(10);
    }
    return;
  }
  if (mode?.type === "confirm") {
    state.mode = null;
    print(`<span class="ps">続けますか？ [y/N]</span> ${esc(raw)}`, "echo");
    if (/^y(es)?$/i.test(raw.trim())) return connect(mode.id, { oneway: true });
    print("中止しました。", "dim");
    printLinks();
    return normalPrompt();
  }

  print(`<span class="ps">${esc($("prompt").textContent)}</span> ${esc(raw)}`, "echo");
  const [name, ...args] = raw.trim().split(/\s+/);
  if (!name) return;
  const key = name.toLowerCase();
  const fn = key === S.finale.command ? finaleCommand : COMMANDS[key];
  if (!fn) return print(`${esc(name)}: コマンドが見つかりません（help で一覧）`, "alert");
  await fn(args.join(" "));
}

// Tab 補完：1語目はコマンド、ssh/cd の後は接続先、最後のコマンドの後は犯人候補
function complete() {
  const v = cmd.value;
  const atEnd = S.nodes[state.current].ending;
  const m = v.match(/^\s*(\S+)\s+(\S*)$/);
  let pool, prefix, head;
  if (m && /^(ssh|cd)$/i.test(m[1])) pool = state.links.map(l => l.name);
  else if (m && atEnd && m[1].toLowerCase() === S.finale.command) pool = S.suspects.map(s => s.id);
  else if (!m && /^\s*\S*$/.test(v)) pool = ["ssh", "back", "help", ...(atEnd ? [S.finale.command] : [])];
  else return;
  if (m) { prefix = m[2]; head = v.slice(0, v.length - prefix.length); }
  else { prefix = v.trim(); head = ""; }
  const hits = pool.filter(p => p.toLowerCase().startsWith(prefix.toLowerCase()));
  if (hits.length === 1) cmd.value = head + hits[0] + (m ? "" : " ");
  else if (hits.length > 1) print(hits.map(esc).join("    "), "dim");
}

// ---------------- 入力 ----------------
const hist = [];
let histPos = 0;

$("form").onsubmit = async e => {
  e.preventDefault();
  if (state.busy) return;
  const raw = cmd.value;
  cmd.value = "";
  if (!state.mode && raw.trim()) { hist.push(raw); }
  histPos = hist.length;
  await run(raw);
};

cmd.addEventListener("keydown", e => {
  if (e.key === "Tab") { e.preventDefault(); if (!state.mode) complete(); }
  else if (e.key === "ArrowUp" && !state.mode && histPos > 0) { e.preventDefault(); cmd.value = hist[--histPos]; }
  else if (e.key === "ArrowDown" && !state.mode) {
    e.preventDefault();
    histPos = Math.min(hist.length, histPos + 1);
    cmd.value = hist[histPos] ?? "";
  }
});

// 名前をタップ → 入力欄にコマンドを入れる（実行は Enter か ⏎ ボタン）
// それ以外の場所をクリック → 入力欄へ（文字選択中は除く）
const finePointer = matchMedia("(pointer: fine)").matches;
$("term").addEventListener("click", e => {
  if (e.target.closest("#run")) return;
  const pick = e.target.closest(".pick");
  if (pick) {
    if (state.busy || state.mode?.type === "password") return;
    cmd.value = pick.dataset.fill;
    // スマホではキーボードを出さない（⏎ ボタンで実行できる）
    if (finePointer) cmd.focus(); else cmd.blur();
    return;
  }
  if (!getSelection().toString()) cmd.focus();
});

// ---------------- 起動 ----------------
function reset() {
  state = {
    current: null, history: [], visited: new Set(), unlocked: new Map(), links: [],
    trace: 0, minutes: 0, over: false, mode: null, busy: false, skip: false, endReady: false,
  };
  $("overlay").className = "";
  $("wrap").classList.remove("glitch");
  cmd.disabled = false;
  $("form").style.visibility = "";
  out.innerHTML = "";
  $("log").innerHTML = "";
  updateTrace();
  print(`${esc(S.title)}  —  anon-net terminal v0.3`, "sys");
  print("help でコマンド一覧", "dim");
  enterNode(S.start);
  cmd.focus();
}

try {
  S = await loadScenario();
} catch (err) {
  print(`シナリオを読み込めませんでした：${esc(err.message)}`, "alert");
  return;
}
$("gameTitle").textContent = S.title;
document.title = S.title;
reset();
})();
</script>
